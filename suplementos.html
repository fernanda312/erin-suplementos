<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:#222;background:#fff}
.top{display:flex;align-items:center;justify-content:center;gap:12px;padding:22px 16px 6px}

h1{text-align:center;font-family:"Playfair Display",Georgia,serif;font-size:34px;margin:10px 0 4px}
.sub{text-align:center;color:#666;margin:0 0 20px;padding:0 16px}
.filters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 16px 20px}
.filters button{border:1px solid #ccc;background:#fff;padding:8px 16px;border-radius:999px;cursor:pointer;font-size:14px}
.filters button.active{background:#41591F;color:#fff;border-color:#41591F}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding:0 16px 40px;max-width:1100px;margin:0 auto}
@media(min-width:768px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{border:1px solid #eee;border-radius:16px;overflow:hidden;text-align:center;padding-bottom:14px;background:#fff}
.card img{width:100%;height:220px;object-fit:contain;background:#fafafa;display:block}
.card h3{font-size:16px;margin:12px 10px 4px}
.serves{font-size:13px;color:#666;margin:0 10px 8px;min-height:36px}
.price{display:inline-block;font-size:17px;font-weight:700;color:#fff;background:#41591F;padding:4px 14px;border-radius:999px;margin:6px 0}
.stock{font-size:13px;color:#555;margin:6px 0 0}
.details{display:inline-block;margin-top:8px;padding:8px 18px;border:1px solid #222;border-radius:999px;background:#fff;cursor:pointer;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal.open{display:flex}.box{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:20px;text-align:center;max-height:90vh;overflow:auto}
.box img{width:100%;max-height:320px;object-fit:contain;background:#fafafa;border-radius:12px}
.box h2{margin:14px 0 6px}.box p{color:#444;line-height:1.5}
.close{float:right;border:0;background:none;font-size:24px;cursor:pointer}
.foot{text-align:center;padding:30px 20px;color:#666;border-top:1px solid #eee}
@media(max-width:767px){.card img{height:170px}.top span{font-size:22px}.top img{height:38px}h1{font-size:28px}}

</head>
