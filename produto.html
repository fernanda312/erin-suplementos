function loadProducts(){try{const s=localStorage.getItem("lv_products_v1");if(s){const p=JSON.parse(s);if(Array.isArray(p)&&p.length)return p;}}catch(e){}return JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));}
const products=loadProducts();
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
function getCart(){try{return JSON.parse(localStorage.getItem(CART_KEY)||"{}");}catch(e){return {};}}
function saveCart(c){try{localStorage.setItem(CART_KEY,JSON.stringify(c));}catch(e){}updateCount();}
function updateCount(){let n=0;const c=getCart();for(const k in c)n+=c[k];document.getElementById("cartCount").textContent=n;}
function toggleMenu(){const n=document.getElementById("mainNav");const b=document.getElementById("burgerBtn");const o=n.classList.toggle("open");b.setAttribute("aria-expanded",o?"true":"false");}
function closeMenu(){const n=document.getElementById("mainNav");if(n)n.classList.remove("open");const b=document.getElementById("burgerBtn");if(b)b.setAttribute("aria-expanded","false");}
document.getElementById("mainNav").addEventListener("click",function(e){if(e.target.closest("a"))closeMenu();});
document.addEventListener("click",function(e){const n=document.getElementById("mainNav");if(n&&n.classList.contains("open")&&!e.target.closest("header"))closeMenu();});
function priceNum(p){return parseFloat(String(p.price).replace(/[^\d.]/g,""))||0;}
function isSoldout(p){return p.soldout===true||p.stock<=0;}
function hasPromo(p){const pr=parseFloat(p.promo)||0;return pr>0&&pr<priceNum(p);}
function fmtNum(v){const n=parseFloat(v)||0;return n.toLocaleString("pt-PT").replace(/,/g,".")+" MT";}
function priceHtml(p){if(hasPromo(p))return '<span class="oldprice">'+esc(p.price)+'</span><span class="price">'+esc(fmtNum(p.promo))+'</span>';return '<span class="price">'+esc(p.price)+'</span>';}
function stockHtml(p){if(isSoldout(p))return '<span class="badge-soldout">Esgotado</span>';return '<div class="stock" style="color:#555">Stock: '+p.stock+'</div>';}
const params=new URLSearchParams(location.search);
const pid=Number(params.get("p"));
const p=products.find(x=>x.id===pid);
const el=document.getElementById("content");
if(!p){
  document.title="Produto não encontrado — LIFE VITAMINS";
  el.innerHTML='<div class="notfound"><h1>Produto não encontrado</h1><p style="color:#666">Este produto não existe ou já não está disponível.</p><a href="loja.html" style="display:inline-block;margin-top:16px;padding:12px 22px;background:linear-gradient(135deg,#2e5a1e,#0a0f0a);color:#fff;border-radius:999px;text-decoration:none">Voltar à loja</a></div>';
}else{
  document.title=p.name+" — LIFE VITAMINS";
  let qty=1;
  const same=products.filter(x=>x.cat===p.cat&&x.id!==p.id);
  el.innerHTML='<div class="detail"><img class="main" src="'+esc(p.img)+'" alt="'+esc(p.name)+'"><div>'
    +'<span class="badge">'+(CAT_LABEL[p.cat]||p.cat)+'</span>'
    +'<h1>'+esc(p.name)+'</h1>'
    +priceHtml(p)
    +'<p class="serves">'+esc(p.serves)+'</p>'
    +'<p class="benefit">'+esc(p.details)+' '+(CAT_BENEFIT[p.cat]||"")+'</p>'
    +stockHtml(p)
    +'<div class="qty"><button id="qminus" aria-label="Menos">−</button><span id="qval">1</span><button id="qplus" aria-label="Mais">+</button></div>'
    +(isSoldout(p)?'<button class="btn-green" disabled style="opacity:.5">Esgotado</button>':(getUser()?'<button class="btn-green" id="addBtn">Adicionar ao carrinho</button>':'<a class="btn-green" href="loja.html#entrar" style="display:inline-block;text-decoration:none;padding:12px 22px">Entrar para comprar</a>'))
    +'<div class="done" id="addedMsg">Adicionado ao carrinho. <a href="loja.html#carrinho">Ver carrinho</a> · <a href="loja.html">Continuar a comprar</a></div>'
    +'<div class="delivery"><h3>Entrega</h3>'
    +'<p><strong>Maputo — 150 MT</strong> · entrega após o pagamento, em horário de expediente.</p>'
    +'<p><strong>Matola — 200 MT</strong> · entrega após o pagamento, em horário de expediente.</p>'
    +'<p><strong>Províncias — 350 MT</strong> · pelo portador diário, 2 a 5 dias úteis após o pagamento.</p>'
    +'<button class="btn-green" onclick="toggleHours()">Ver horários</button>'
    +'<div id="hoursPanel" style="display:none;margin-top:10px;text-align:left;line-height:1.6"><div id="hoursContent" style="white-space:pre-line"></div><p style="color:#666">As entregas são feitas após o pagamento, em horário de expediente.</p></div></div>'
    +'</div></div>'
    +'<h2 class="seg">Produtos do mesmo segmento: '+(CAT_LABEL[p.cat]||p.cat)+'</h2>'
    +'<div class="grid">'+same.map(q=>'<div class="card"><img src="'+esc(q.img)+'" alt="'+esc(q.name)+'" loading="lazy"><h3>'+esc(q.name)+'</h3>'+priceHtml(q)+'<br>'+stockHtml(q)+'<br><a class="det" href="produto.html?p='+q.id+'">Ver detalhes</a></div>').join("")+'</div>';
  document.getElementById("qminus").onclick=()=>{if(qty>1){qty--;document.getElementById("qval").textContent=qty;}};
  document.getElementById("qplus").onclick=()=>{if(isSoldout(p))return;if(qty<p.stock){qty++;document.getElementById("qval").textContent=qty;}};
  const addBtnEl=document.getElementById("addBtn");
  if(addBtnEl)addBtnEl.onclick=()=>{if(isSoldout(p)){alert("Este produto está esgotado.");return;}if(!getUser()){location.href="loja.html#entrar";return;}
    const cart=getCart();
    const cur=cart[p.id]||0;
    if(cur>=p.stock){alert("Stock: "+p.stock+" unidades.");return;}
    cart[p.id]=Math.min(p.stock,cur+qty);
    saveCart(cart);
    document.getElementById("addedMsg").style.display="block";
  };
}
try{const lg=localStorage.getItem("lv_logo");if(lg)document.getElementById("siteLogo").src=lg;}catch(e){}
updateCount();
applyGating();
